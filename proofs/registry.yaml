# Stage registry. `ci: true` means CI runs `make prove-N` for this stage.
# state: planned | in-progress | proved (make prove-N passes) | done (proved AND approved)
# A stage becomes `done` only when Aleksander records approval below.
# Do not start stage N+1 until stage N is `done`.
stages:
  - id: 0
    name: Foundation
    weeks: "1 week"
    cost: "$0"
    state: in-progress
    ci: true
    approved_by: null
    approved_on: null
