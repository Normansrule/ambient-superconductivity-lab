name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Tests and stage proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: pip install -r requirements-ci.txt -e .
      - name: Unit tests
        run: python -m pytest
      - name: Bibliography lint
        run: make lint-bib
      - name: README status table is current
        run: make readme && git diff --exit-code README.md
      - name: Stage proofs (verifies every DOI online first)
        env:
          ASL_CONTACT_EMAIL: ${{ vars.ASL_CONTACT_EMAIL }}
        run: make prove-all
      - name: Report a stale verification cache
        if: always()
        run: |
          if ! git diff --quiet docs/references.verified.json; then
            echo "::warning::docs/references.verified.json changed. Download the proof-results artifact and commit it."
          fi
      - name: Upload proof results and verification cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-results
          path: |
            proofs/stage*/result.json
            docs/references.verified.json

  site:
    name: Site build and visual proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual tests (non-blank canvas and screenshots)
        run: npm run test:visual
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-proof
          path: |
            site/test-results
            site/playwright-report

  manim:
    name: Manim scenes (low quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: System libraries for Manim
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev ffmpeg pkg-config
      - name: Install Manim
        run: pip install manim
      - name: Render scenes
        run: make manim
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: manim-videos
          path: build/manim
