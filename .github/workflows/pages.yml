name: pages

# Builds the site, runs every stage proof, publishes the results as status
# badges (status/stageN.json), and deploys to GitHub Pages. Badges show
# failing proofs too, so this workflow deploys even when a proof fails;
# the `ci` workflow is the gate that goes red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python package
        run: pip install -r requirements-ci.txt -e .
      - name: Run stage proofs (results feed the badges)
        env:
          ASL_CONTACT_EMAIL: ${{ vars.ASL_CONTACT_EMAIL }}
        run: make prove-all || echo "::warning::A stage proof failed; its badge will show failing."
      - name: Write status badges into the site
        run: make status
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
