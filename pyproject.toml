[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asl"
version = "0.0.1"
description = "Ambient Superconductivity Lab: a staged, provable platform for studying superconductivity and evaluating claims."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aleksander Norman" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Normansrule/ambient-superconductivity-lab"
Documentation = "https://normansrule.github.io/ambient-superconductivity-lab/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
